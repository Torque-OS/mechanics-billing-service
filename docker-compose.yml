services:
  billing-api:
    build: .
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=billing;Username=postgres;Password=postgres
      ConnectionStrings__Mongo: mongodb://mongo:27017
      JWT_SECRET: dev-secret-change-in-production-min-32-chars!!
      RABBITMQ_CONNECTION_STRING: amqp://guest:guest@rabbitmq:5672/
      # Mercado Pago sandbox: values come from .env (gitignored) — see env.example
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_EXTERNAL_POS_ID: ${MERCADOPAGO_EXTERNAL_POS_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # Saga broker (ADR-011) for local development; management UI at http://localhost:15672 (guest/guest).
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billing
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - billing_pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - billing_mongodata:/data/db

volumes:
  billing_pgdata:
  billing_mongodata:
